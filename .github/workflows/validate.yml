name: Validar

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Comprobar sintaxis de src/**/*.lua (luac -p)
        run: |
          set -e
          find src -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
          echo "Todos los archivos de src/ compilan."

      - name: Ejecutar sim/run_tests.lua
        run: lua5.4 sim/run_tests.lua

      - name: version.json es JSON valido con "version"
        run: |
          set -e
          python3 - <<'PY'
          import json, sys

          with open("version.json") as f:
              data = json.load(f)

          if not data.get("version"):
              print("version.json no tiene 'version'")
              sys.exit(1)

          print("version.json OK: version %s" % data["version"])
          PY
